# Re-renders the README screenshots and GIF from demo mode on PRs that change the UI, and attaches them to the run.
# It never pushes: main only takes signed commits through PRs. These renders are the canonical images (a local
# Chromium renders fonts slightly differently), so to refresh the README, download the artifact into docs/ and commit it.
name: Screenshots
on:
  pull_request:
    paths: ["prdash/web/**", "prdash/demo.py", "prdash/standup.py", "tests/screenshots.mjs", ".github/workflows/screenshots.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Render from demo mode (fictional data only)
        env: { PRDASH_HOME: /tmp/prdash-demo, CHROME: google-chrome }
        run: |
          python -m prdash --demo --no-open --port 8770 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8770/ && break; sleep 1; done
          node tests/screenshots.mjs
      - name: List images that differ from the PR's docs/
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git status --short docs/
            echo "::notice::Screenshots differ from docs/. Download the screenshots artifact into docs/ and commit it."
          else
            echo "screenshots unchanged"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: "docs/*.png\ndocs/*.gif", retention-days: 14 }
